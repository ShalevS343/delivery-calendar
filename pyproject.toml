[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-calendar"
version = "0.1.0"
description = "Delivery mail to Google Calendar, one event per arrived shipment"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "dateparser>=1.2,<2",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "APScheduler>=3.10,<4",
  "google-api-python-client>=2.120,<3",
  "google-auth>=2.29,<3",
  "google-auth-httplib2>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<1"]

[project.scripts]
delivery-calendar = "delivery_calendar.cli:main"

[tool.setuptools]
packages = ["delivery_calendar"]

[tool.setuptools.package-data]
delivery_calendar = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
