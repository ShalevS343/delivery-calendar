name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/shalevs343/delivery-calendar:latest
            ghcr.io/shalevs343/delivery-calendar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portainer's poll only deploys when the commit hash changes, so a build
      # that finishes after the commit was already seen is never picked up.
      # Pushing an empty marker commit once the image exists gives the poll a
      # new hash to react to, with the image already in the registry.
      # (Pushes made with GITHUB_TOKEN do not trigger workflows; "[skip ci]" is
      # the second guard.)
      - name: Push a deploy marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: image ${GITHUB_SHA::7} published [skip ci]"
          git push

      # A public package lets the Pi pull without storing registry credentials.
      # If the token cannot change visibility, the step is skipped and the
      # fallback is a GHCR registry entry in Portainer.
      - name: Try to make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/delivery-calendar \
            -f visibility=public
