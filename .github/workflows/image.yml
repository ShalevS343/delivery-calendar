name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/shalevs343/delivery-calendar:latest
            ghcr.io/shalevs343/delivery-calendar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A public package lets the Pi pull without storing registry credentials.
      # If the token cannot change visibility, the step is skipped and the
      # fallback is a GHCR registry entry in Portainer.
      - name: Try to make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/delivery-calendar \
            -f visibility=public
